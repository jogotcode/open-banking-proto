<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Financial Hub Map</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="map"></div>

  <div class="topbar">
    <form id="search-form" class="searchbox" autocomplete="off" role="search">
      <svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M15.5 14h-.79l-.28-.27A6.47 6.47 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
      <input id="search-input" type="text" placeholder="Search places, addresses or hubs" aria-label="Search places, addresses or hubs" />
      <button id="search-clear" type="button" class="icon-btn" aria-label="Clear search" hidden>×</button>
      <ul id="suggestions" class="suggestions" hidden></ul>
    </form>

    <div class="chips">
      <button id="my-hubs-toggle" type="button" class="chip-btn" aria-expanded="false" aria-controls="my-hubs">My hubs</button>
      <button id="create-toggle" type="button" class="chip-btn create-chip">+ Start a hub</button>
      <button id="wallet-toggle" type="button" class="chip-btn" aria-expanded="false" aria-controls="wallet">Wallet</button>
      <button id="filter-toggle" type="button" class="chip-btn" aria-expanded="false">Value: All ▾</button>
      <button id="pick-location" type="button" class="chip-btn" title="Prototype: set your location by clicking the map">Simulate location</button>
      <span id="location-status" class="chip-btn static">Location off</span>
    </div>

    <button id="account-btn" type="button" class="signin-btn">Sign in</button>

    <div id="filter-panel" class="card filter" hidden>
      <label>
        Min value
        <input id="min-value" type="range" min="0" max="100" value="0" />
        <output id="min-label">$0</output>
      </label>
      <label>
        Max value
        <input id="max-value" type="range" min="0" max="100" value="100" />
        <output id="max-label">$0</output>
      </label>
      <div class="filter-foot">
        <span id="count"></span>
        <button id="reset" type="button" class="secondary">Reset</button>
      </div>
    </div>
  </div>

  <aside id="my-hubs" class="side-panel" aria-label="My hubs" hidden>
    <header class="panel-head">
      <h2>My hubs</h2>
      <button id="my-hubs-close" type="button" class="icon-btn" aria-label="Close">×</button>
    </header>
    <div id="my-hubs-body" class="panel-body"></div>
  </aside>

  <aside id="wallet" class="side-panel" aria-label="Wallet" hidden>
    <header class="panel-head">
      <h2>Wallet</h2>
      <button id="wallet-close" type="button" class="icon-btn" aria-label="Close">×</button>
    </header>
    <div id="wallet-body" class="panel-body"></div>
  </aside>

  <div id="status" class="status" hidden></div>

  <dialog id="join-dialog" class="join-dialog" aria-label="Bubble details">
    <div id="join-body"></div>
  </dialog>

  <dialog id="create-dialog" class="join-dialog account-dialog" aria-label="Start a hub">
    <div id="create-body"></div>
  </dialog>

  <dialog id="request-dialog" class="join-dialog account-dialog" aria-label="Request funds">
    <div id="request-body"></div>
  </dialog>

  <dialog id="account-dialog" class="join-dialog account-dialog" aria-label="Account">
    <div id="account-body"></div>
  </dialog>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="cities.js"></script>
  <script src="hubs.js"></script>
  <script src="auth.js"></script>
  <script src="join.js"></script>
  <script src="funds.js"></script>
  <script src="startup.js"></script>
  <script src="app.js"></script>
  <script src="my-hubs.js"></script>
  <script src="account.js"></script>
  <script src="wallet.js"></script>
  <script src="create-hub.js"></script>
</body>
</html>
